# Net-SNMP snmpd.conf - configured by net_monitor
# Listen on all interfaces, UDP port 161
agentAddress udp:161,udp6:161

# System information
sysLocation    MintServer Room
sysContact     admin@mint.local
sysName        mint
sysDescr       Linux Mint Network Monitor Server

# SNMPv2c - read-only community
rocommunity    public  default

# Allow system info, interfaces, CPU, memory, disk (host MIB)
view    systemview    included   .1.3.6.1.2.1.1
view    systemview    included   .1.3.6.1.2.1.2
view    systemview    included   .1.3.6.1.2.1.25.1
view    systemview    included   .1.3.6.1.4.1.2021

# Disk monitoring
disk /      10%
disk /home  10%

# Load average
load 12 14 14
